name: Phase 8 Mobile Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  mobile-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm exec tsc -- --noEmit

      # Runway gates run first: they are pure-logic and fast, and a failing step
      # skips every step after it. `test:aspect-aware-media` below has been red
      # since the 2026-07-27 detail-first tiering change (its expectations still
      # describe the old progressive card->detail path), which would otherwise
      # mask these entirely.
      - name: Runway responsiveness contract
        run: npm run test:runway-responsiveness-contract

      - name: Runway transit curves
        run: npm run test:runway-transit-curves

      # Pure-logic too, and guarding a failure nobody can see: the server stores
      # one measurement under several keys on purpose, so a missing alias here
      # renders a shopper's body twice on their own profile and drops a point
      # out of the "6/8 sizing points" total. Also checks the alias table
      # against the backend's, which is where the two actually drift.
      - name: Measurement catalog contract
        run: npm run test:measurement-catalog-contract

      # Who gets asked how to size their clothes. The web and native copies of
      # this rule have drifted twice already — console operators were excluded
      # on one surface before the other, and the auth-route skip lists diverged
      # so the prompt opened over /verify-email after being fixed elsewhere.
      # Runs the real function from both repos over the same accounts.
      - name: Profile gender prompt contract
        run: npm run test:profile-gender-contract

      - name: Aspect-aware media contract
        run: npm run test:aspect-aware-media

      - name: Brand profile contract
        run: npm run test:brand-profile-contract

      - name: Design editor contract
        run: npm run test:design-editor-contract

      - name: Store API contract
        run: npm run test:store-api-contract

      # Guards the Runway vertical feed. The responsiveness contract is what stops
      # the boosted interval-snapping props being "restored" (they were the cause
      # of the settle slamming into the next page); the transit curve tests cover
      # the scroll-linked scrim/scale/chrome geometry. Neither was wired into CI
      # when it was written, so both were enforceable only by remembering to run
      # them locally.
      - name: Runway responsiveness contract
        run: npm run test:runway-responsiveness-contract

      - name: Runway transit curves
        run: npm run test:runway-transit-curves

      - name: Performance regression guard
        run: npm run check:perf-regressions
